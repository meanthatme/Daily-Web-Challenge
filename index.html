<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 로또 추첨기</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        h1 { color: #333; }
        #ball-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            min-height: 60px;
        }
        .ball {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            animation: bounce 0.5s ease;
        }
        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        
        /* 공 색상 규정 */
        .color-1 { background-color: #fbc400; } /* 1~10 */
        .color-2 { background-color: #69c8f2; } /* 11~20 */
        .color-3 { background-color: #ff7272; } /* 21~30 */
        .color-4 { background-color: #aaa; }    /* 31~40 */
        .color-5 { background-color: #b0d840; } /* 41~45 */

        @keyframes bounce {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>🍀 로또 번호 추첨기</h1>
    <div id="ball-container">
        </div>
    <button onclick="generateLotto()">번호 추첨하기</button>

    <script>
        function generateLotto() {
            const container = document.getElementById('ball-container');
            container.innerHTML = ''; // 기존 번호 초기화
            
            const numbers = [];
            while (numbers.length < 6) {
                const num = Math.floor(Math.random() * 45) + 1;
                if (!numbers.includes(num)) {
                    numbers.push(num);
                }
            }
            
            // 번호 정렬
            numbers.sort((a, b) => a - b);

            // 공 만들기
            numbers.forEach((num, index) => {
                setTimeout(() => {
                    const ball = document.createElement('div');
                    ball.className = `ball ${getColorClass(num)}`;
                    ball.innerText = num;
                    container.appendChild(ball);
                }, index * 100); // 0.1초 간격으로 생성 애니메이션
            });
        }

        function getColorClass(num) {
            if (num <= 10) return 'color-1';
            if (num <= 20) return 'color-2';
            if (num <= 30) return 'color-3';
            if (num <= 40) return 'color-4';
            return 'color-5';
        }
    </script>
</body>
</html>
